<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Gasy-mal – Comptage de points</title>
  <style>
    :root {
      --fond: #f5f6fa; --carte: #ffffff; --texte: #1c1e26; --discret: #6b7080;
      --bord: #e4e6ee; --accent: #4f46e5; --accent-texte: #ffffff;
      --ok: #137333; --erreur: #c5221f; --rayon: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #12131a; --carte: #1d1f29; --texte: #eceef5; --discret: #9aa0b4;
              --bord: #2e3140; --accent: #7c75ff; --accent-texte: #101018; --ok: #6dd58c; --erreur: #ff8b85; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--fond); color: var(--texte);
           font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }

    /* ----- En-tête ----- */
    #entete { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .5rem;
              padding: calc(.6rem + env(safe-area-inset-top)) 1rem .6rem; background: var(--fond); }
    #entete h1 { flex: 1; margin: 0; font-size: 1.25rem; text-align: center; }
    .icone { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--carte);
             color: var(--texte); font-size: 1.3rem; cursor: pointer; box-shadow: 0 1px 3px #0002; }
    .icone[hidden] { display: block !important; visibility: hidden; }

    main { max-width: 560px; margin: 0 auto; padding: .5rem 1rem calc(6rem + env(safe-area-inset-bottom)); }
    h2 { font-size: 1rem; color: var(--discret); text-transform: uppercase; letter-spacing: .04em; margin: 1.5rem 0 .5rem; }

    /* ----- Boutons ----- */
    button { font: inherit; }
    .gros { display: block; width: 100%; min-height: 56px; border: 0; border-radius: var(--rayon);
            background: var(--accent); color: var(--accent-texte); font-weight: 600; font-size: 1.1rem; cursor: pointer; }
    .gros.secondaire { background: var(--carte); color: var(--texte); border: 1px solid var(--bord); }
    .gros:active, .menu button:active, .ligne-joueur:active { transform: scale(.98); }
    .puce { min-height: 44px; padding: 0 1rem; border: 1px solid var(--bord); border-radius: 999px;
            background: var(--carte); color: var(--texte); cursor: pointer; white-space: nowrap; }
    .puce[aria-pressed="true"] { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
    .rang-puces { display: flex; gap: .5rem; overflow-x: auto; padding: .25rem 0 .5rem; scrollbar-width: none; }

    /* ----- Accueil ----- */
    .menu { display: grid; gap: .9rem; margin-top: 1rem; }
    .menu button { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 1.2rem; text-align: left;
                   border: 1px solid var(--bord); border-radius: var(--rayon); background: var(--carte);
                   color: var(--texte); cursor: pointer; box-shadow: 0 1px 3px #0001; }
    .menu .emoji { font-size: 2rem; }
    .menu strong { display: block; font-size: 1.15rem; }
    .menu span.sous { color: var(--discret); font-size: .9rem; }
    .menu .principal { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
    .menu .principal .sous { color: inherit; opacity: .85; }

    /* ----- Chrono ----- */
    #affichageChrono { font-size: clamp(4.5rem, 24vw, 8rem); font-weight: 700; text-align: center;
                       font-variant-numeric: tabular-nums; margin: 2.5rem 0 2rem; }
    #affichageChrono.fini { color: var(--erreur); animation: clignote 1s steps(2) infinite; }
    @keyframes clignote { 50% { opacity: .25; } }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    details { margin-top: 1.5rem; background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .8rem 1rem; }
    summary { cursor: pointer; min-height: 32px; }
    .reglage { display: flex; gap: .8rem; margin: .8rem 0; }
    .reglage label { flex: 1; font-size: .85rem; color: var(--discret); }

    /* ----- Champs ----- */
    input { width: 100%; min-height: 48px; padding: .5rem .8rem; border: 1px solid var(--bord); border-radius: 12px;
            background: var(--fond); color: var(--texte); font-size: 16px; }
    label.champ { display: block; margin: .8rem 0; font-size: .85rem; color: var(--discret); }
    label.champ input { margin-top: .25rem; }

    /* ----- Mois ----- */
    .mois { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .mois strong { font-size: 1.2rem; text-transform: capitalize; }
    .mois button:disabled { opacity: .35; }

    /* ----- Classement / listes ----- */
    ol, ul { list-style: none; padding: 0; margin: 0; }
    .carte-liste { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); overflow: hidden; }
    .carte-liste li { display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; border-bottom: 1px solid var(--bord); }
    .carte-liste li:last-child { border-bottom: 0; }
    .rang { width: 2rem; text-align: center; font-size: 1.3rem; color: var(--discret); }
    .nom { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .nom small { display: block; color: var(--discret); }
    .score { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .score small { display: block; font-size: .75rem; font-weight: 400; color: var(--discret); }
    .vide { color: var(--discret); text-align: center; padding: 1.5rem 1rem !important; display: block !important; }
    .ligne-joueur { width: 100%; border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
                    display: flex; align-items: center; gap: .8rem; min-height: 44px; padding: 0; }
    .plus { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;
            border-radius: 50%; background: var(--accent); color: var(--accent-texte); font-size: 1.5rem; }
    .positif { color: var(--ok); } .negatif { color: var(--erreur); }
    .suppr { border: 0; background: none; color: var(--erreur); font-size: 1.2rem; min-width: 44px; min-height: 44px; cursor: pointer; }

    /* ----- Feuille d'ajout de points ----- */
    dialog { width: 100%; max-width: 560px; margin: auto auto 0; border: 0; border-radius: 24px 24px 0 0;
             padding: 1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom)); background: var(--carte); color: var(--texte); }
    dialog::backdrop { background: #0008; }
    dialog h3 { margin: 0 0 .5rem; font-size: 1.25rem; }
    .deltas { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0 1rem; }
    .deltas .puce { flex: 1; min-width: 3.5rem; padding: 0; }
    #fPoints { font-size: 2rem; text-align: center; font-weight: 700; min-height: 64px; }

    /* ----- Message ----- */
    #statut { position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 20;
              max-width: 528px; margin: 0 auto; padding: .9rem 1rem; border-radius: 14px; background: var(--texte);
              color: var(--fond); text-align: center; box-shadow: 0 4px 16px #0004; }
    #statut.erreur { background: var(--erreur); color: #fff; }
    #statut.ok { background: var(--ok); color: #fff; }
  </style>
</head>
<body>
  <header id="entete">
    <button id="retour" class="icone" aria-label="Retour" hidden>←</button>
    <h1 id="titre">Gasy-mal</h1>
    <button id="actualiser" class="icone" aria-label="Actualiser les points">⟳</button>
  </header>

  <main>
    <!-- ACCUEIL -->
    <section id="vue-accueil" class="vue">
      <div class="menu">
        <button class="principal" data-vue="partie">
          <span class="emoji">▶️</span>
          <span><strong>Lancer une partie</strong><span class="sous">Affiche seulement le chronomètre</span></span>
        </button>
        <button data-vue="points">
          <span class="emoji">🏆</span>
          <span><strong>Consulter les points</strong><span class="sous" id="resume">Classement par mois</span></span>
        </button>
        <button data-vue="joueurs">
          <span class="emoji">👥</span>
          <span><strong>Joueurs</strong><span class="sous">Voir les joueurs et ajouter des points</span></span>
        </button>
      </div>
    </section>

    <!-- PARTIE : chronomètre seul -->
    <section id="vue-partie" class="vue" hidden>
      <div id="affichageChrono">05:00</div>
      <div class="duo">
        <button id="chronoDemarrer" class="gros">Démarrer</button>
        <button id="chronoReset" class="gros secondaire">Remettre à zéro</button>
      </div>
      <details>
        <summary>⚙️ Régler la durée</summary>
        <div class="reglage">
          <label>Minutes <input id="chronoMin" type="number" inputmode="numeric" min="0" max="999" value="5"></label>
          <label>Secondes <input id="chronoSec" type="number" inputmode="numeric" min="0" max="59" value="0"></label>
        </div>
        <div class="rang-puces">
          <button class="puce" data-preset="30">30 s</button>
          <button class="puce" data-preset="60">1 min</button>
          <button class="puce" data-preset="180">3 min</button>
          <button class="puce" data-preset="300">5 min</button>
          <button class="puce" data-preset="600">10 min</button>
          <button class="puce" data-preset="900">15 min</button>
        </div>
      </details>
    </section>

    <!-- POINTS : consultation -->
    <section id="vue-points" class="vue" hidden>
      <div class="mois">
        <button id="moisPrec" class="icone" aria-label="Mois précédent">‹</button>
        <strong id="nomMois"></strong>
        <button id="moisSuiv" class="icone" aria-label="Mois suivant">›</button>
      </div>
      <div class="rang-puces" id="puces" role="group" aria-label="Filtrer par partie"></div>
      <h2>Classement</h2>
      <ol id="classement" class="carte-liste"></ol>
      <h2>Détail du mois</h2>
      <ul id="historique" class="carte-liste"></ul>
    </section>

    <!-- JOUEURS -->
    <section id="vue-joueurs" class="vue" hidden>
      <button id="nouveauJoueur" class="gros">＋ Nouveau joueur</button>
      <h2>Joueurs</h2>
      <ul id="listeJoueursVue" class="carte-liste"></ul>
    </section>
  </main>

  <p id="statut" role="status" hidden></p>

  <!-- Feuille d'ajout de points -->
  <dialog id="feuille">
    <form id="formulaire" method="dialog">
      <h3 id="feuilleTitre">Ajouter des points</h3>
      <label class="champ" id="champNom">Nom du joueur
        <input id="fNom" maxlength="50" autocomplete="off">
      </label>
      <label class="champ">Partie
        <input id="fPartie" list="listeParties" maxlength="50" autocomplete="off" placeholder="ex. Belote">
      </label>
      <datalist id="listeParties"></datalist>
      <label class="champ">Points (négatif pour en retirer)
        <input id="fPoints" type="number" inputmode="numeric" step="1" placeholder="0">
      </label>
      <div class="deltas">
        <button type="button" class="puce" data-delta="-5">−5</button>
        <button type="button" class="puce" data-delta="-1">−1</button>
        <button type="button" class="puce" data-delta="1">+1</button>
        <button type="button" class="puce" data-delta="5">+5</button>
        <button type="button" class="puce" data-delta="10">+10</button>
      </div>
      <div class="duo">
        <button type="button" id="fAnnuler" class="gros secondaire">Annuler</button>
        <button type="submit" id="fValider" class="gros">Valider</button>
      </div>
    </form>
  </dialog>

  <script>
    // =====================================================================
    // ▼▼▼  À MODIFIER : adresse de votre application web Apps Script  ▼▼▼
    // =====================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsdtwQcgvbdJqi2ZV0xg2X96e7SmvKrSY2uZoOXCIWVl32PMmF6PuOmyC6xpxuxk86/exec";
    // =====================================================================

    const $ = id => document.getElementById(id);
    const TOUTES = "__toutes__";
    let lignes = [];
    let saisonChoisie = null;
    let partieChoisie = TOUTES;
    let derniereMaj = 0;

    // ---------- Petits outils ----------
    let minuteurStatut;
    function statut(texte, classe, dureeMs) {
      clearTimeout(minuteurStatut);
      const el = $("statut");
      if (!texte) { el.hidden = true; return; }
      el.hidden = false; el.className = classe || ""; el.textContent = texte;
      if (dureeMs) minuteurStatut = setTimeout(() => { el.hidden = true; }, dureeMs);
    }
    function lireLocal(cle, defaut) { try { return localStorage.getItem(cle) || defaut; } catch (e) { return defaut; } }
    function ecrireLocal(cle, valeur) { try { localStorage.setItem(cle, valeur); } catch (e) {} }

    function moisCourant() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function nomMois(saison) {
      const [a, m] = saison.split("-");
      const noms = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
      return (noms[Number(m) - 1] || m) + " " + a;
    }
    function dateCourte(s) { // "2026-11-12 14:02" -> "12/11 14:02"
      const m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s);
      return m ? m[2] + "/" + m[1] + " " + m[3] : s;
    }
    function signe(n) { return (n > 0 ? "+" : "") + n; }
    function el(tag, classe, texte) {
      const e = document.createElement(tag);
      if (classe) e.className = classe;
      if (texte !== undefined) e.textContent = texte;
      return e;
    }
    function saisonsDispo() {
      return [...new Set(lignes.map(l => l.saison).concat(moisCourant()))].sort();
    }

    // ---------- Navigation ----------
    const TITRES = { accueil: "Gasy-mal", partie: "Partie", points: "Points", joueurs: "Joueurs" };
    let vueActuelle = "accueil";

    function afficherVue(nom) {
      vueActuelle = nom;
      document.querySelectorAll(".vue").forEach(v => { v.hidden = v.id !== "vue-" + nom; });
      $("titre").textContent = TITRES[nom];
      $("retour").hidden = nom === "accueil";
      $("actualiser").hidden = nom === "accueil" || nom === "partie";
      if (nom === "partie") { if (chrono.enCours) garderEcran(); } else libererEcran();
      if (nom !== "accueil" && nom !== "partie") charger(true);
      window.scrollTo(0, 0);
    }
    function route() {
      const nom = location.hash.slice(1);
      afficherVue(TITRES[nom] ? nom : "accueil");
    }
    window.addEventListener("hashchange", route);
    document.querySelectorAll("[data-vue]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.vue; }));
    $("retour").addEventListener("click", () => { location.hash = "accueil"; });

    // ---------- Communication avec le script Google ----------
    async function appeler(options) {
      if (APPS_SCRIPT_URL.startsWith("__")) throw new Error("L'adresse du script n'est pas renseignée dans index.html.");
      let reponse;
      try { reponse = await fetch(APPS_SCRIPT_URL, options); }
      catch (e) { throw new Error("Connexion impossible. Vérifiez votre réseau, puis réessayez."); }
      if (!reponse.ok) throw new Error("Le serveur a répondu avec une erreur (code " + reponse.status + ").");
      let donnees;
      try { donnees = await reponse.json(); }
      catch (e) { throw new Error("Réponse illisible du script. Vérifiez son déploiement (accès : Tout le monde)."); }
      if (!donnees.ok) throw new Error(donnees.erreur || "Erreur inconnue du script.");
      return donnees;
    }

    async function charger(discret) {
      if (discret && Date.now() - derniereMaj < 20000) return; // évite de surcharger le script
      if (!discret) statut("Chargement…");
      try {
        const donnees = await appeler();
        lignes = donnees.lignes;
        derniereMaj = Date.now();
        afficher();
        if (!discret) statut("");
      } catch (e) { statut(e.message, "erreur"); }
    }
    $("actualiser").addEventListener("click", () => { derniereMaj = 0; charger(false); });

    async function envoyer(corps, messageOk) {
      statut("Enregistrement…");
      try {
        // Pas d'en-tête Content-Type : évite un blocage de sécurité du navigateur (CORS)
        const donnees = await appeler({ method: "POST", body: JSON.stringify(corps) });
        lignes = donnees.lignes;
        derniereMaj = Date.now();
        afficher();
        statut(messageOk, "ok", 2500);
        return true;
      } catch (e) { statut(e.message, "erreur"); return false; }
    }

    // ---------- Calculs ----------
    function calculer(saison, partie) {
      const totaux = {};
      lignes.filter(l => partie === TOUTES || l.partie === partie).forEach(l => {
        const t = totaux[l.joueur] || (totaux[l.joueur] = { mois: 0, cumul: 0 });
        t.cumul += l.points;
        if (l.saison === saison) t.mois += l.points;
      });
      return Object.entries(totaux)
        .map(([joueur, t]) => ({ joueur, mois: t.mois, cumul: t.cumul }))
        .sort((a, b) => b.mois - a.mois || b.cumul - a.cumul || a.joueur.localeCompare(b.joueur));
    }

    // ---------- Affichage des données ----------
    function afficher() {
      const saisons = saisonsDispo();
      if (!saisonChoisie || !saisons.includes(saisonChoisie)) saisonChoisie = moisCourant();
      const parties = [...new Set(lignes.map(l => l.partie))].sort();
      if (partieChoisie !== TOUTES && !parties.includes(partieChoisie)) partieChoisie = TOUTES;

      // Résumé sur l'accueil
      const top = calculer(moisCourant(), TOUTES)[0];
      $("resume").textContent = top && top.mois > 0 ? "🥇 " + top.joueur + " en tête ce mois-ci (" + top.mois + " pts)" : "Classement par mois";

      // Liste des parties (pour la saisie)
      const dl = $("listeParties"); dl.textContent = "";
      parties.forEach(p => { const o = el("option"); o.value = p; dl.appendChild(o); });

      afficherPoints(saisons, parties);
      afficherJoueurs();
    }

    function afficherPoints(saisons, parties) {
      const i = saisons.indexOf(saisonChoisie);
      $("nomMois").textContent = nomMois(saisonChoisie);
      $("moisPrec").disabled = i <= 0;
      $("moisSuiv").disabled = i >= saisons.length - 1;

      const puces = $("puces"); puces.textContent = "";
      [TOUTES].concat(parties).forEach(p => {
        const b = el("button", "puce", p === TOUTES ? "Toutes les parties" : p);
        b.setAttribute("aria-pressed", String(p === partieChoisie));
        b.addEventListener("click", () => { partieChoisie = p; afficher(); });
        puces.appendChild(b);
      });

      const medailles = ["🥇", "🥈", "🥉"];
      const liste = $("classement"); liste.textContent = "";
      const classement = calculer(saisonChoisie, partieChoisie).filter(c => c.mois !== 0 || c.cumul !== 0);
      if (!classement.length) liste.appendChild(el("li", "vide", "Aucun point pour le moment."));
      classement.forEach((c, k) => {
        const li = el("li");
        li.appendChild(el("span", "rang", c.mois > 0 && k < 3 ? medailles[k] : String(k + 1)));
        li.appendChild(el("span", "nom", c.joueur));
        const score = el("span", "score", String(c.mois));
        score.appendChild(el("small", "", "total : " + c.cumul));
        li.appendChild(score);
        liste.appendChild(li);
      });

      const histo = $("historique"); histo.textContent = "";
      const duMois = lignes.filter(l => l.saison === saisonChoisie && (partieChoisie === TOUTES || l.partie === partieChoisie)).reverse();
      if (!duMois.length) histo.appendChild(el("li", "vide", "Rien ce mois-ci."));
      duMois.forEach(l => {
        const li = el("li");
        const nom = el("span", "nom", l.joueur);
        nom.appendChild(el("small", "", l.partie + " · " + dateCourte(l.date)));
        li.appendChild(nom);
        li.appendChild(el("span", "score " + (l.points >= 0 ? "positif" : "negatif"), signe(l.points)));
        const b = el("button", "suppr", "✕");
        b.setAttribute("aria-label", "Supprimer cette ligne");
        b.addEventListener("click", () => {
          if (confirm("Supprimer cette ligne ?\n" + l.joueur + " : " + signe(l.points) + " (" + l.partie + ")"))
            envoyer({ action: "supprimer", id: l.id }, "Ligne supprimée.");
        });
        li.appendChild(b);
        histo.appendChild(li);
      });
    }

    $("moisPrec").addEventListener("click", () => { const s = saisonsDispo(); saisonChoisie = s[Math.max(0, s.indexOf(saisonChoisie) - 1)]; afficher(); });
    $("moisSuiv").addEventListener("click", () => { const s = saisonsDispo(); saisonChoisie = s[Math.min(s.length - 1, s.indexOf(saisonChoisie) + 1)]; afficher(); });

    function afficherJoueurs() {
      const liste = $("listeJoueursVue"); liste.textContent = "";
      const mois = Object.fromEntries(calculer(moisCourant(), TOUTES).map(c => [c.joueur, c.mois]));
      const noms = Object.keys(mois).sort((a, b) => a.localeCompare(b));
      if (!noms.length) liste.appendChild(el("li", "vide", "Aucun joueur pour le moment. Ajoutez-en un !"));
      noms.forEach(nom => {
        const li = el("li");
        const b = el("button", "ligne-joueur");
        b.setAttribute("aria-label", "Ajouter des points à " + nom);
        const n = el("span", "nom", nom);
        n.appendChild(el("small", "", "ce mois-ci : " + mois[nom] + " pts"));
        b.appendChild(n);
        b.appendChild(el("span", "plus", "＋"));
        b.addEventListener("click", () => ouvrirFeuille(nom));
        li.appendChild(b);
        liste.appendChild(li);
      });
    }

    // ---------- Feuille d'ajout de points ----------
    function ouvrirFeuille(joueur) {
      const nouveau = !joueur;
      $("feuilleTitre").textContent = nouveau ? "Nouveau joueur" : "Points pour " + joueur;
      $("champNom").hidden = !nouveau;
      $("fNom").value = joueur || "";
      $("fNom").required = nouveau;
      const derniere = lignes.length ? lignes[lignes.length - 1].partie : "";
      $("fPartie").value = lireLocal("dernierePartie", derniere);
      $("fPoints").value = "";
      $("feuille").showModal();
      (nouveau ? $("fNom") : $("fPoints")).focus();
    }
    $("nouveauJoueur").addEventListener("click", () => ouvrirFeuille(null));
    $("fAnnuler").addEventListener("click", () => $("feuille").close());
    document.querySelectorAll("[data-delta]").forEach(b => b.addEventListener("click", () => {
      $("fPoints").value = (Number($("fPoints").value) || 0) + Number(b.dataset.delta);
    }));

    $("formulaire").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const nom = $("fNom").value.trim(), partie = $("fPartie").value.trim(), points = Number($("fPoints").value);
      if (!nom) { statut("Entrez le nom du joueur.", "erreur", 3000); return; }
      if (!partie) { statut("Entrez le nom de la partie.", "erreur", 3000); return; }
      if (!points || !Number.isInteger(points)) { statut("Entrez un nombre de points entier, différent de zéro.", "erreur", 3000); return; }
      $("fValider").disabled = true;
      const reussi = await envoyer({ action: "ajouter", partie, joueur: nom, points }, signe(points) + " pour " + nom + " ✔");
      $("fValider").disabled = false;
      if (reussi) { ecrireLocal("dernierePartie", partie); $("feuille").close(); }
    });
    // Fermer la feuille en touchant en dehors
    $("feuille").addEventListener("click", ev => { if (ev.target === $("feuille")) $("feuille").close(); });

    // ---------- Chronomètre (compte à rebours personnalisable) ----------
    const chrono = { restant: 0, fin: 0, minuteur: null, enCours: false };
    let verrouEcran = null;

    async function garderEcran() { // empêche la mise en veille pendant la partie
      try { if ("wakeLock" in navigator && !verrouEcran) verrouEcran = await navigator.wakeLock.request("screen"); } catch (e) {}
    }
    function libererEcran() { try { if (verrouEcran) verrouEcran.release(); } catch (e) {} verrouEcran = null; }

    function dureeSaisie() {
      const m = Math.min(999, Math.max(0, Math.floor(Number($("chronoMin").value) || 0)));
      const s = Math.min(59, Math.max(0, Math.floor(Number($("chronoSec").value) || 0)));
      return m * 60 + s;
    }
    function afficherChrono(sec) {
      $("affichageChrono").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
    }
    function bip() {
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.35, 0.7].forEach(d => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.4, ctx.currentTime + d);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.25);
          o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.3);
        });
      } catch (e) {}
    }
    function arreterChrono() {
      clearInterval(chrono.minuteur);
      chrono.enCours = false;
      $("chronoDemarrer").textContent = "Démarrer";
      libererEcran();
    }
    function tic() {
      chrono.restant = Math.max(0, Math.ceil((chrono.fin - Date.now()) / 1000));
      afficherChrono(chrono.restant);
      if (chrono.restant === 0) {
        arreterChrono();
        $("affichageChrono").classList.add("fini");
        $("chronoDemarrer").textContent = "Relancer";
        bip();
        if (vueActuelle !== "partie") statut("⏰ Temps écoulé !", "ok", 6000);
      }
    }
    function reglerChrono(sec) {
      arreterChrono();
      chrono.restant = sec;
      $("affichageChrono").classList.remove("fini");
      $("chronoMin").value = Math.floor(sec / 60);
      $("chronoSec").value = sec % 60;
      afficherChrono(sec);
      ecrireLocal("chronoDuree", String(sec));
    }
    $("chronoDemarrer").addEventListener("click", () => {
      if (chrono.enCours) { // Pause
        chrono.restant = Math.max(0, Math.ceil((chrono.fin - Date.now()) / 1000));
        arreterChrono();
        $("chronoDemarrer").textContent = "Reprendre";
        return;
      }
      if (chrono.restant <= 0) reglerChrono(dureeSaisie());
      if (chrono.restant <= 0) { statut("Entrez une durée supérieure à 0.", "erreur", 3000); return; }
      $("affichageChrono").classList.remove("fini");
      chrono.fin = Date.now() + chrono.restant * 1000;
      chrono.enCours = true;
      $("chronoDemarrer").textContent = "Pause";
      chrono.minuteur = setInterval(tic, 250);
      garderEcran();
      tic();
    });
    $("chronoReset").addEventListener("click", () => reglerChrono(dureeSaisie()));
    ["chronoMin", "chronoSec"].forEach(id => $(id).addEventListener("change", () => { if (!chrono.enCours) reglerChrono(dureeSaisie()); }));
    document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => reglerChrono(Number(b.dataset.preset))));

    // ---------- Démarrage ----------
    reglerChrono(Number(lireLocal("chronoDuree", "300")) || 300);
    route();
    charger(false);
    // Mise à jour automatique douce : seulement si la page est visible et sur les écrans de points
    setInterval(() => { if (document.visibilityState === "visible" && (vueActuelle === "points" || vueActuelle === "joueurs")) charger(true); }, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (chrono.enCours && vueActuelle === "partie") garderEcran();
        if (vueActuelle === "points" || vueActuelle === "joueurs") charger(true);
      }
    });
  </script>
</body>
</html>
