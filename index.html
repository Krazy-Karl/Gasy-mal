<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gasy-mal – Comptage de points</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    button { font-size: 1rem; padding: .7rem 1.2rem; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    button:disabled { background: #999; cursor: default; }
    #message { margin-top: 1.5rem; }
    .erreur { color: #b00020; }
    .ok { color: #137333; }
  </style>
</head>
<body>
  <h1>Comptage de points</h1>
  <button id="tester">Tester la connexion</button>
  <p id="message"></p>

  <script>
    // =====================================================================
    // ▼▼▼  À MODIFIER : collez ici l'adresse de votre application web  ▼▼▼
    // (elle ressemble à https://script.google.com/macros/s/XXXX/exec)
    // =====================================================================
    const APPS_SCRIPT_URL = "COLLEZ-L-ADRESSE-DU-SCRIPT-ICI";
    // =====================================================================

    const bouton = document.getElementById("tester");
    const message = document.getElementById("message");

    function afficher(texte, classe) {
      message.className = classe || "";
      message.textContent = texte;
    }

    bouton.addEventListener("click", async () => {
      if (APPS_SCRIPT_URL.startsWith("COLLEZ")) {
        afficher("L'adresse du script n'est pas renseignée. Remplacez APPS_SCRIPT_URL en haut de index.html.", "erreur");
        return;
      }
      bouton.disabled = true;
      afficher("Connexion en cours…");
      try {
        const reponse = await fetch(APPS_SCRIPT_URL);
        if (!reponse.ok) throw new Error("code " + reponse.status);
        const donnees = await reponse.json();
        afficher(donnees.message, "ok");
      } catch (e) {
        afficher("Impossible de joindre le script. Vérifiez l'adresse et que le déploiement est réglé sur « Tout le monde ». (" + e.message + ")", "erreur");
      }
      bouton.disabled = false;
    });
  </script>
</body>
</html>
