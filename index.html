<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gasy-mal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#4f46e5">
  <title>Gasy-mal – Comptage de points</title>
  <!-- Applique le thème choisi tout de suite, pour éviter un flash blanc -->
  <script>
    try { const t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <!-- Icônes Google (Material Symbols) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <style>
    :root {
      color-scheme: light;
      --fond: #f5f6fa; --carte: #ffffff; --texte: #1c1e26; --discret: #6b7080;
      --bord: #e4e6ee; --accent: #4f46e5; --accent-texte: #ffffff;
      --ok: #137333; --erreur: #c5221f; --rayon: 16px;
      --or: #d4a017; --argent: #8f98a8; --bronze: #b87333;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --fond: #12131a; --carte: #1d1f29; --texte: #eceef5; --discret: #9aa0b4;
      --bord: #2e3140; --accent: #7c75ff; --accent-texte: #101018; --ok: #3aa65e; --erreur: #ff8b85;
      --or: #f2c14e; --argent: #b5bccb; --bronze: #d9915a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --fond: #12131a; --carte: #1d1f29; --texte: #eceef5; --discret: #9aa0b4;
        --bord: #2e3140; --accent: #7c75ff; --accent-texte: #101018; --ok: #3aa65e; --erreur: #ff8b85;
        --or: #f2c14e; --argent: #b5bccb; --bronze: #d9915a;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }  /* pas de "tirer pour rafraîchir" par accident */
    body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input { -webkit-user-select: text; user-select: text; }
    body { margin: 0; background: var(--fond); color: var(--texte);
           font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }

    /* ----- Icônes ----- */
    .material-symbols-rounded { font-size: 24px; line-height: 1; vertical-align: middle; user-select: none; visibility: hidden; }
    html.icones-pretes .material-symbols-rounded { visibility: visible; }

    /* ----- En-tête ----- */
    #entete { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem;
              padding: calc(.6rem + env(safe-area-inset-top)) 1rem .6rem; background: var(--fond); }
    #entete h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .actions-entete { display: flex; gap: .5rem; justify-content: flex-end; }
    .icone { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0;
             border: 1px solid var(--bord); border-radius: 50%; background: var(--carte); color: var(--texte); cursor: pointer; }
    .icone[hidden] { display: inline-flex !important; visibility: hidden; }
    .icone:disabled { opacity: .35; }

    main { max-width: 560px; margin: 0 auto; padding: .5rem 1rem calc(6rem + env(safe-area-inset-bottom)); }
    h2 { font-size: .9rem; color: var(--discret); text-transform: uppercase; letter-spacing: .04em; margin: 1.5rem 0 .5rem; }

    /* ----- Boutons ----- */
    button { font: inherit; }
    .gros { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; min-height: 56px;
            border: 0; border-radius: var(--rayon); background: var(--accent); color: var(--accent-texte);
            font-weight: 600; font-size: 1.05rem; cursor: pointer; }
    .gros.secondaire { background: var(--carte); color: var(--texte); border: 1px solid var(--bord); }
    .gros:active, .menu button:active, .ligne-joueur:active, .ligne-point:active { transform: scale(.98); }
    .puce { min-height: 44px; padding: 0 1rem; border: 1px solid var(--bord); border-radius: 999px;
            background: var(--carte); color: var(--texte); cursor: pointer; white-space: nowrap; }
    .puce[aria-pressed="true"] { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
    .rang-puces { display: flex; gap: .5rem; overflow-x: auto; padding: .25rem 0 .5rem; scrollbar-width: none; }

    /* ----- Accueil ----- */
    .menu { display: grid; gap: .9rem; margin-top: 1rem; }
    .menu button { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 1.1rem; text-align: left;
                   border: 1px solid var(--bord); border-radius: var(--rayon); background: var(--carte);
                   color: var(--texte); cursor: pointer; }
    .menu .pastille { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 52px; height: 52px;
                      border-radius: 14px; background: var(--fond); color: var(--accent); }
    .menu .pastille .material-symbols-rounded { font-size: 30px; }
    .menu strong { display: block; font-size: 1.15rem; }
    .menu .sous { color: var(--discret); font-size: .9rem; }
    .menu .principal { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }
    .menu .principal .pastille { background: #ffffff30; color: var(--accent-texte); }
    .menu .principal .sous { color: inherit; opacity: .85; }

    /* ----- Chrono ----- */
    .etiquette { text-align: center; color: var(--discret); margin-top: 1.5rem; font-size: 1.1rem; }
    #affichageChrono { font-size: clamp(4.5rem, 24vw, 8rem); font-weight: 700; text-align: center; line-height: 1.1;
                       font-variant-numeric: tabular-nums; margin: .4rem 0 .6rem; }
    #affichageChrono.fini { color: var(--erreur); animation: clignote 1s steps(2) infinite; }
    #affichageChrono.depart { color: var(--accent); }
    @keyframes clignote { 50% { opacity: .25; } }
    #infoTotal { text-align: center; color: var(--discret); margin-bottom: .6rem; }
    #infoTotal b { color: var(--texte); font-variant-numeric: tabular-nums; }
    .barre-chrono { position: relative; height: 10px; border-radius: 999px; background: var(--bord); margin: .4rem 0 1.4rem; overflow: hidden; }
    #barreRemplie { height: 100%; width: 0; background: var(--accent); }
    .repere { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fond); }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    .gros + .gros { margin-top: .8rem; }
    .duo + .gros { margin-top: .8rem; }
    details { margin-top: 1.2rem; background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .8rem 1rem; }
    summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; gap: .5rem; }
    .reglage { display: flex; gap: .8rem; margin: .8rem 0; }
    .reglage label { flex: 1; font-size: .85rem; color: var(--discret); }
    .option { display: flex; align-items: center; gap: .7rem; min-height: 44px; margin-top: .6rem; }
    .option input[type=checkbox] { width: 24px; height: 24px; min-height: 0; accent-color: var(--accent); }
    .aide { color: var(--discret); font-size: .85rem; margin: .3rem 0 0; }

    /* ----- Points en pleine partie ----- */
    #panneauPoints { margin-top: .8rem; background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: .8rem; }
    #panneauPoints .carte-liste { max-height: 42vh; overflow-y: auto; margin-top: .5rem; }
    .ligne-point { display: flex; align-items: center; gap: .5rem; width: 100%; min-height: 56px; padding: 0 0 0 1rem; border: 0;
                   background: none; color: inherit; text-align: left; cursor: pointer; }
    .badge { min-width: 3rem; text-align: center; padding: .15rem .6rem; border-radius: 999px; background: var(--accent); color: var(--accent-texte); font-weight: 700; }
    .badge.zero { background: var(--bord); color: var(--discret); }

    /* ----- Champs ----- */
    input { width: 100%; min-height: 48px; padding: .5rem .8rem; border: 1px solid var(--bord); border-radius: 12px;
            background: var(--fond); color: var(--texte); font-size: 16px; }
    label.champ { display: block; margin: .8rem 0; font-size: .85rem; color: var(--discret); }
    label.champ input { margin-top: .25rem; }

    /* ----- Mois ----- */
    .mois { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .mois strong { font-size: 1.2rem; text-transform: capitalize; }

    /* ----- Classement / listes ----- */
    ol, ul { list-style: none; padding: 0; margin: 0; }
    .carte-liste { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); overflow: hidden; }
    .carte-liste li { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; border-bottom: 1px solid var(--bord); }
    .carte-liste li.sans-marge { padding: 0; }
    .carte-liste li:last-child { border-bottom: 0; }
    .rang { width: 2rem; text-align: center; font-size: 1.2rem; color: var(--discret); }
    .rang .material-symbols-rounded { font-size: 28px; }
    .rang.r1 { color: var(--or); } .rang.r2 { color: var(--argent); } .rang.r3 { color: var(--bronze); }
    .nom { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .nom small { display: block; color: var(--discret); }
    .score { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .score small { display: block; font-size: .75rem; font-weight: 400; color: var(--discret); }
    .vide { color: var(--discret); text-align: center; padding: 1.5rem 1rem !important; display: block !important; }
    .ligne-joueur { flex: 1; min-width: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
                    display: flex; align-items: center; gap: .8rem; min-height: 64px; padding: .5rem 1rem; }
    .plus { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px;
            border-radius: 50%; background: var(--accent); color: var(--accent-texte); }
    .positif { color: var(--ok); } .negatif { color: var(--erreur); }
    .suppr { display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; color: var(--discret); min-width: 44px; min-height: 44px; cursor: pointer; }

    /* ----- Feuille du bas ----- */
    dialog { width: 100%; max-width: 560px; margin: auto auto 0; border: 0; border-radius: 24px 24px 0 0;
             padding: 1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom)); background: var(--carte); color: var(--texte); }
    dialog::backdrop { background: #0008; }
    dialog h3 { margin: 0 0 .5rem; font-size: 1.25rem; }
    .deltas { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0 1rem; }
    .deltas .puce { flex: 1; min-width: 3.5rem; padding: 0; }
    #fPoints { font-size: 2rem; text-align: center; font-weight: 700; min-height: 64px; }

    /* ----- Message ----- */
    #statut { position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 20;
              max-width: 528px; margin: 0 auto; padding: .9rem 1rem; border-radius: 14px; background: var(--texte);
              color: var(--fond); text-align: center; box-shadow: 0 4px 16px #0004; }
    #statut.erreur { background: var(--erreur); color: #fff; }
    #statut.ok { background: var(--ok); color: #fff; }
  </style>
</head>
<body>
  <header id="entete">
    <button id="retour" class="icone" aria-label="Retour" hidden><span class="material-symbols-rounded">arrow_back</span></button>
    <h1 id="titre">Gasy-mal</h1>
    <div class="actions-entete">
      <button id="actualiser" class="icone" aria-label="Actualiser les points"><span class="material-symbols-rounded">refresh</span></button>
      <button id="pleinEcranBtn" class="icone" aria-label="Plein écran"><span class="material-symbols-rounded" id="pleinEcranIcone">fullscreen</span></button>
      <button id="themeBtn" class="icone" aria-label="Changer le thème clair ou sombre"><span class="material-symbols-rounded" id="themeIcone">dark_mode</span></button>
    </div>
  </header>

  <main>
    <!-- ACCUEIL -->
    <section id="vue-accueil" class="vue">
      <div class="menu">
        <button class="principal" data-vue="partie">
          <span class="pastille"><span class="material-symbols-rounded">play_arrow</span></span>
          <span><strong>Lancer une partie</strong><span class="sous">Chronomètre et points en direct</span></span>
        </button>
        <button data-vue="points">
          <span class="pastille"><span class="material-symbols-rounded">leaderboard</span></span>
          <span><strong>Consulter les points</strong><span class="sous" id="resume">Classement par mois</span></span>
        </button>
        <button data-vue="joueurs">
          <span class="pastille"><span class="material-symbols-rounded">group</span></span>
          <span><strong>Joueurs</strong><span class="sous">Voir les joueurs et ajouter des points</span></span>
        </button>
      </div>
    </section>

    <!-- PARTIE : chronomètre + points en direct -->
    <section id="vue-partie" class="vue" hidden>
      <div id="etiquetteChrono" class="etiquette">Chronomètre</div>
      <div id="affichageChrono">05:00</div>
      <div id="infoTotal" hidden>Temps total restant : <b id="totalChrono">10:00</b></div>
      <div id="barre" class="barre-chrono" hidden><div id="barreRemplie"></div></div>

      <div class="duo">
        <button id="chronoDemarrer" class="gros"></button>
        <button id="chronoReset" class="gros secondaire"><span class="material-symbols-rounded">restart_alt</span>Remise à zéro</button>
      </div>

      <button id="boutonPoints" class="gros secondaire"><span class="material-symbols-rounded">add_circle</span><span id="boutonPointsTexte">Attribuer des points</span></button>
      <section id="panneauPoints" hidden>
        <p class="aide" style="margin-top:0">Touchez un nom pour lui donner 1 point.</p>
        <ul id="listePoints" class="carte-liste"></ul>
      </section>

      <details>
        <summary><span class="material-symbols-rounded">settings</span>Régler le chronomètre</summary>
        <div class="reglage">
          <label>Minutes <input id="chronoMin" type="number" inputmode="numeric" min="0" max="999" value="5"></label>
          <label>Secondes <input id="chronoSec" type="number" inputmode="numeric" min="0" max="59" value="0"></label>
        </div>
        <div class="rang-puces">
          <button class="puce" data-preset="30">30 s</button>
          <button class="puce" data-preset="60">1 min</button>
          <button class="puce" data-preset="180">3 min</button>
          <button class="puce" data-preset="300">5 min</button>
          <button class="puce" data-preset="600">10 min</button>
          <button class="puce" data-preset="900">15 min</button>
        </div>
        <label class="option"><input id="sousOn" type="checkbox"> Diviser en manches (sous-chronomètre)</label>
        <div id="blocManches" hidden>
          <label class="champ">Nombre de manches
            <input id="chronoManches" type="number" inputmode="numeric" min="2" max="60" value="2">
          </label>
          <p class="aide" id="aideManches"></p>
        </div>
        <label class="champ">Compte à rebours avant le départ (secondes, 0 = aucun)
          <input id="chronoDelai" type="number" inputmode="numeric" min="0" max="10" value="3">
        </label>
      </details>
    </section>

    <!-- POINTS : consultation -->
    <section id="vue-points" class="vue" hidden>
      <div class="mois">
        <button id="moisPrec" class="icone" aria-label="Mois précédent"><span class="material-symbols-rounded">chevron_left</span></button>
        <strong id="nomMois"></strong>
        <button id="moisSuiv" class="icone" aria-label="Mois suivant"><span class="material-symbols-rounded">chevron_right</span></button>
      </div>
      <h2>Classement</h2>
      <ol id="classement" class="carte-liste"></ol>
      <h2>Détail du mois</h2>
      <ul id="historique" class="carte-liste"></ul>
    </section>

    <!-- JOUEURS -->
    <section id="vue-joueurs" class="vue" hidden>
      <button id="nouveauJoueur" class="gros"><span class="material-symbols-rounded">person_add</span>Nouveau joueur</button>
      <h2>Joueurs</h2>
      <ul id="listeJoueursVue" class="carte-liste"></ul>
    </section>
  </main>

  <p id="statut" role="status" hidden></p>

  <!-- Feuille du bas : nouveau joueur / ajout de points -->
  <dialog id="feuille">
    <form id="formulaire" method="dialog">
      <h3 id="feuilleTitre">Ajouter des points</h3>
      <label class="champ" id="champNom">Nom du joueur
        <input id="fNom" maxlength="50" autocomplete="off">
      </label>
      <div id="blocPoints">
        <label class="champ">Points (négatif pour en retirer)
          <input id="fPoints" type="number" inputmode="numeric" step="1" placeholder="0">
        </label>
        <div class="deltas">
          <button type="button" class="puce" data-delta="-5">−5</button>
          <button type="button" class="puce" data-delta="-1">−1</button>
          <button type="button" class="puce" data-delta="1">+1</button>
          <button type="button" class="puce" data-delta="5">+5</button>
          <button type="button" class="puce" data-delta="10">+10</button>
        </div>
      </div>
      <div class="duo">
        <button type="button" id="fAnnuler" class="gros secondaire">Annuler</button>
        <button type="submit" id="fValider" class="gros">Valider</button>
      </div>
    </form>
  </dialog>

  <script>
    // =====================================================================
    // ▼▼▼  À MODIFIER : adresse de votre application web Apps Script  ▼▼▼
    // =====================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsdtwQcgvbdJqi2ZV0xg2X96e7SmvKrSY2uZoOXCIWVl32PMmF6PuOmyC6xpxuxk86/exec";
    // =====================================================================

    const $ = id => document.getElementById(id);
    let lignes = [];
    let saisonChoisie = null;
    let derniereMaj = 0;
    let ecrituresEnCours = 0;        // enregistrements en attente de confirmation de Google
    const suppressionsEnAttente = new Set();
    let compteurTmp = 0;

    // ---------- Petits outils ----------
    let minuteurStatut;
    function statut(texte, classe, dureeMs) {
      clearTimeout(minuteurStatut);
      const el = $("statut");
      if (!texte) { el.hidden = true; return; }
      el.hidden = false; el.className = classe || ""; el.textContent = texte;
      if (dureeMs) minuteurStatut = setTimeout(() => { el.hidden = true; }, dureeMs);
    }
    function lireLocal(cle, defaut) { try { return localStorage.getItem(cle) || defaut; } catch (e) { return defaut; } }
    function ecrireLocal(cle, valeur) { try { localStorage.setItem(cle, valeur); } catch (e) {} }

    function el(tag, classe, texte) {
      const e = document.createElement(tag);
      if (classe) e.className = classe;
      if (texte !== undefined) e.textContent = texte;
      return e;
    }
    function icone(nom) { const s = el("span", "material-symbols-rounded", nom); s.setAttribute("aria-hidden", "true"); return s; }
    function bouton(classe, nomIcone, texte) {
      const b = el("button", classe);
      if (nomIcone) b.appendChild(icone(nomIcone));
      if (texte) b.appendChild(document.createTextNode(texte));
      return b;
    }

    function moisCourant() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function nomMois(saison) {
      const [a, m] = saison.split("-");
      const noms = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
      return (noms[Number(m) - 1] || m) + " " + a;
    }
    function dateCourte(s) { // "2026-11-12 14:02" -> "12/11 14:02"
      const m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s);
      return m ? m[2] + "/" + m[1] + " " + m[3] : s;
    }
    function signe(n) { return (n > 0 ? "+" : "") + n; }
    function saisonsDispo() { return [...new Set(lignes.map(l => l.saison).concat(moisCourant()))].sort(); }
    function nomsJoueurs() { return [...new Set(lignes.map(l => l.joueur))].sort((a, b) => a.localeCompare(b)); }
    function mm_ss(sec) { return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); }

    // ---------- Thème clair / sombre ----------
    function themeEffectif() {
      return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    function majThemeInterface() {
      const sombre = themeEffectif() === "dark";
      $("themeIcone").textContent = sombre ? "light_mode" : "dark_mode"; // l'icône montre ce qu'on obtiendra
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = sombre ? "#12131a" : "#4f46e5";
    }
    $("themeBtn").addEventListener("click", () => {
      const nouveau = themeEffectif() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = nouveau;
      ecrireLocal("theme", nouveau);
      majThemeInterface();
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", majThemeInterface);

    // ---------- Plein écran ----------
    const racine = document.documentElement;
    const peutPleinEcran = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const enPleinEcran = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!peutPleinEcran) $("pleinEcranBtn").style.display = "none"; // ex. iPhone : voir "Ajouter à l'écran d'accueil"
    $("pleinEcranBtn").addEventListener("click", () => {
      try {
        if (enPleinEcran()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else {
          const demande = (racine.requestFullscreen || racine.webkitRequestFullscreen).call(racine);
          if (demande && demande.catch) demande.catch(() => statut("Le plein écran est refusé par ce navigateur.", "erreur", 3000));
        }
      } catch (e) { statut("Le plein écran est refusé par ce navigateur.", "erreur", 3000); }
    });

    // ---------- Navigation ----------

    // ---------- Communication avec le script Google ----------
    async function appeler(options) {
      if (APPS_SCRIPT_URL.startsWith("__")) throw new Error("L'adresse du script n'est pas renseignée dans index.html.");
      let reponse;
      try { reponse = await fetch(APPS_SCRIPT_URL, options); }
      catch (e) { throw new Error("Connexion impossible. Vérifiez votre réseau, puis réessayez."); }
      if (!reponse.ok) throw new Error("Le serveur a répondu avec une erreur (code " + reponse.status + ").");
      let donnees;
      try { donnees = await reponse.json(); }
      catch (e) { throw new Error("Réponse illisible du script. Vérifiez son déploiement (accès : Tout le monde)."); }
      if (!donnees.ok) {
        if (donnees.erreur === "Action inconnue.") throw new Error("Le script Google n'est pas à jour : collez la nouvelle version de Code.gs et redéployez-le.");
        throw new Error(donnees.erreur || "Erreur inconnue du script.");
      }
      return donnees;
    }

    async function charger(discret) {
      if (discret && Date.now() - derniereMaj < 20000) return; // évite de surcharger le script
      if (!discret) statut("Chargement…");
      try {
        const donnees = await appeler();
        // Pendant un enregistrement, on ignore cette lecture pour ne pas écraser l'affichage immédiat
        if (ecrituresEnCours === 0) { appliquerServeur(donnees.lignes); derniereMaj = Date.now(); afficher(); }
        if (!discret) statut("");
      } catch (e) { statut(e.message, "erreur"); }
    }
    $("actualiser").addEventListener("click", () => { derniereMaj = 0; charger(false); });

    // Remplace les données par celles du serveur, en gardant ce qui est encore en cours d'enregistrement
    function appliquerServeur(lignesServeur) {
      lignes = lignesServeur.filter(l => !suppressionsEnAttente.has(l.id)).concat(lignes.filter(l => l.enAttente));
    }
    function maintenantTexte() {
      const d = new Date(), n = x => String(x).padStart(2, "0");
      return d.getFullYear() + "-" + n(d.getMonth() + 1) + "-" + n(d.getDate()) + " " + n(d.getHours()) + ":" + n(d.getMinutes());
    }

    // Affichage immédiat, puis confirmation par Google en arrière-plan.
    // En cas d'échec, on annule ce qui a été affiché et on explique pourquoi.
    async function ecrire(corps, local) {
      ecrituresEnCours++;
      let index = -1;
      const renommees = [];
      if (local.renomme) {
        const { ancien, nouveau } = local.renomme;
        lignes.forEach(l => { if (l.joueur === ancien) { l.joueur = nouveau; renommees.push(l); } });
        if (pointsPartie[ancien] !== undefined) { pointsPartie[nouveau] = (pointsPartie[nouveau] || 0) + pointsPartie[ancien]; delete pointsPartie[ancien]; }
      }
      if (local.ajoute) lignes.push(local.ajoute);
      if (local.supprime) {
        index = lignes.findIndex(l => l.id === local.supprime.id);
        if (index >= 0) lignes.splice(index, 1);
        suppressionsEnAttente.add(local.supprime.id);
      }
      afficher();
      try {
        // Pas d'en-tête Content-Type : évite un blocage de sécurité du navigateur (CORS)
        const donnees = await appeler({ method: "POST", body: JSON.stringify(corps) });
        if (local.ajoute) {
          lignes = lignes.filter(l => l !== local.ajoute);
          if (donnees.ligne) { if (!lignes.some(l => l.id === donnees.ligne.id)) lignes.push(donnees.ligne); }
        }
        if (local.supprime) suppressionsEnAttente.delete(local.supprime.id);
        if (donnees.lignes) appliquerServeur(donnees.lignes); // ancienne version du script : renvoie toute la liste
        derniereMaj = Date.now();
        afficher();
        return true;
      } catch (e) {
        if (local.renomme) {
          const { ancien, nouveau } = local.renomme;
          renommees.forEach(l => { l.joueur = ancien; });
          if (pointsPartie[nouveau] !== undefined) { pointsPartie[ancien] = (pointsPartie[ancien] || 0) + pointsPartie[nouveau]; delete pointsPartie[nouveau]; }
        }
        if (local.ajoute) lignes = lignes.filter(l => l !== local.ajoute);
        if (local.supprime) {
          suppressionsEnAttente.delete(local.supprime.id);
          if (index >= 0) lignes.splice(index, 0, local.supprime); else lignes.push(local.supprime);
        }
        afficher();
        statut(e.message, "erreur");
        return false;
      } finally { ecrituresEnCours--; }
    }

    function nouvelleLigne(joueur, points) {
      return { id: "tmp-" + (++compteurTmp), date: maintenantTexte(), saison: moisCourant(), joueur, points, enAttente: true };
    }

    // ---------- Calculs ----------
    function calculer(saison) {
      const totaux = {};
      lignes.forEach(l => {
        const t = totaux[l.joueur] || (totaux[l.joueur] = { mois: 0, cumul: 0 });
        t.cumul += l.points;
        if (l.saison === saison) t.mois += l.points;
      });
      return Object.entries(totaux)
        .map(([joueur, t]) => ({ joueur, mois: t.mois, cumul: t.cumul }))
        .sort((a, b) => b.mois - a.mois || b.cumul - a.cumul || a.joueur.localeCompare(b.joueur));
    }

    $("moisPrec").addEventListener("click", () => { const s = saisonsDispo(); saisonChoisie = s[Math.max(0, s.indexOf(saisonChoisie) - 1)]; afficher(); });
    $("moisSuiv").addEventListener("click", () => { const s = saisonsDispo(); saisonChoisie = s[Math.min(s.length - 1, s.indexOf(saisonChoisie) + 1)]; afficher(); });

    function afficherJoueurs() {

    // ---------- Feuille du bas : nouveau joueur / points ----------

    $("formulaire").addEventListener("submit", async (ev) => {

    $("boutonPoints").addEventListener("click", () => {

    function afficherPanneauPoints() {
      const liste = $("listePoints"); liste.textContent = "";
      const noms = nomsJoueurs();
      if (!noms.length) {
        liste.appendChild(el("li", "vide", "Aucun joueur. Ajoutez-en depuis l'écran Joueurs."));

    async function pointRapide(joueur, delta) {
      pointsPartie[joueur] = (pointsPartie[joueur] || 0) + delta;
      afficherPanneauPoints();
      const ok = await ecrire({ action: "ajouter", joueur, points: delta }, { ajoute: nouvelleLigne(joueur, delta) });
      if (!ok) { pointsPartie[joueur] -= delta; afficherPanneauPoints(); }
    }

    // ---------- Sons ----------
    let ctxAudio = null;
    function audio() {
      try {
        if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        if (ctxAudio.state === "suspended") ctxAudio.resume();
      } catch (e) {}
      return ctxAudio;
    }
    function note(freq, debut, duree, volume, type) {
      const c = audio(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.value = freq; o.connect(g); g.connect(c.destination);
      const t = c.currentTime + debut;
      g.gain.setValueAtTime(volume || 0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + duree);
      o.start(t); o.stop(t + duree + 0.05);
    }
    function vibrer(motif) { try { if (navigator.vibrate) navigator.vibrate(motif); } catch (e) {} }
    // Quatre sons bien différents :
    function sonTick()   { note(500, 0, 0.12, 0.3); }                                  // compte à rebours : tic grave et court
    function sonGo()     { note(1000, 0, 0.7, 0.4); note(1500, 0, 0.7, 0.25); vibrer(200); } // départ : note aiguë et longue
    function sonManche() { note(700, 0, 0.18, 0.4, "triangle"); note(700, 0.25, 0.18, 0.4, "triangle"); vibrer([150, 80, 150]); } // fin de manche : double bip
    function sonFin()    { [880, 880, 880].forEach((f, i) => note(f, i * 0.4, 0.3, 0.45, "square")); note(1320, 1.3, 1, 0.4, "square"); vibrer([400, 150, 400, 150, 800]); } // fin : triple bip + note longue

    // ---------- Chronomètre avec sous-chronomètre ----------
    // phases : repos, depart (compte à rebours de lancement), course, pause, fini
    const chrono = { phase: "repos", totalMs: 0, restantMs: 0, fin: 0, depart: 0, manches: 1, limites: [0, 0], mancheVue: 0, departVu: 0, minuteur: null };
    let verrouEcran = null;

    async function garderEcran() { try { if ("wakeLock" in navigator && !verrouEcran) verrouEcran = await navigator.wakeLock.request("screen"); } catch (e) {} }
    function libererEcran() { try { if (verrouEcran) verrouEcran.release(); } catch (e) {} verrouEcran = null; }

    function lireReglages() {
      const m = Math.min(999, Math.max(0, Math.floor(Number($("chronoMin").value) || 0)));
      const s = Math.min(59, Math.max(0, Math.floor(Number($("chronoSec").value) || 0)));
      const total = m * 60 + s;
      let manches = $("sousOn").checked ? Math.floor(Number($("chronoManches").value) || 2) : 1;
      manches = Math.max(1, Math.min(60, manches));
      const delai = Math.min(10, Math.max(0, Math.floor(Number($("chronoDelai").value) || 0)));
      return { total, manches, delai, sous: $("sousOn").checked };
    }

    function majBoutonDemarrer() {
      const textes = { repos: ["play_arrow", "Démarrer"], depart: ["close", "Annuler"], course: ["pause", "Pause"], pause: ["play_arrow", "Reprendre"], fini: ["replay", "Relancer"] };
      const [ic, txt] = textes[chrono.phase];
      const b = $("chronoDemarrer"); b.textContent = "";
      b.appendChild(icone(ic)); b.appendChild(document.createTextNode(txt));
    }

    function arreterBoucle() { clearInterval(chrono.minuteur); chrono.minuteur = null; }

    // Prépare le chrono avec les réglages actuels (remise à zéro)
    function initialiserChrono() {
      arreterBoucle(); libererEcran();
      const r = lireReglages();
      $("blocManches").hidden = !r.sous;
      chrono.phase = "repos";
      chrono.totalMs = r.total * 1000;
      chrono.restantMs = chrono.totalMs;
      chrono.manches = Math.max(1, Math.min(r.manches, Math.max(1, r.total)));
      chrono.limites = Array.from({ length: chrono.manches + 1 }, (_, k) => Math.round(chrono.totalMs * k / chrono.manches));
      chrono.mancheVue = 0; chrono.departVu = 0;
      ecrireLocal("chronoReglages", JSON.stringify({ total: r.total, manches: r.manches, delai: r.delai, sous: r.sous }));
      $("aideManches").textContent = r.sous && r.total > 0
        ? (r.manches > r.total ? "Trop de manches pour cette durée." : "Chaque manche dure environ " + mm_ss(Math.round(r.total / r.manches)) + ".")
        : "";
      // repères sur la barre
      const barre = $("barre");
      barre.querySelectorAll(".repere").forEach(n => n.remove());
      for (let k = 1; k < chrono.manches; k++) {
        const rep = el("div", "repere"); rep.style.left = (100 * k / chrono.manches) + "%"; barre.appendChild(rep);
      }
      majBoutonDemarrer();
      rendre();
    }

    // Met à jour l'affichage selon la phase et l'heure
    function rendre() {
      const N = chrono.manches, T = chrono.totalMs;
      const grand = $("affichageChrono");
      grand.classList.remove("fini", "depart");
      $("infoTotal").hidden = N <= 1;
      $("barre").hidden = N <= 1;

      if (chrono.phase === "depart") {
        const reste = Math.max(1, Math.ceil((chrono.depart - Date.now()) / 1000));
        grand.textContent = String(reste); grand.classList.add("depart");
        $("etiquetteChrono").textContent = "Préparez-vous";
        return;
      }
      const restant = chrono.phase === "course" ? Math.max(0, chrono.fin - Date.now()) : chrono.restantMs;
      const ecoule = T - restant;
      let i = 0; while (i < N - 1 && ecoule >= chrono.limites[i + 1]) i++;
      const resteManche = chrono.limites[i + 1] - ecoule;
      grand.textContent = mm_ss(Math.ceil((N > 1 ? resteManche : restant) / 1000));
      if (chrono.phase === "fini") grand.classList.add("fini");
      $("etiquetteChrono").textContent = chrono.phase === "fini" ? "Terminé" : (N > 1 ? "Manche " + (i + 1) + " / " + N : "Chronomètre");
      $("totalChrono").textContent = mm_ss(Math.ceil(restant / 1000));
      $("barreRemplie").style.width = (T ? 100 * ecoule / T : 0) + "%";
      return i;
    }

    function tic() {
      const maintenant = Date.now();
      if (chrono.phase === "depart") {
        const reste = Math.ceil((chrono.depart - maintenant) / 1000);
        if (reste > 0) {
          if (reste !== chrono.departVu) { chrono.departVu = reste; sonTick(); }
          rendre(); return;
        }
        chrono.phase = "course";
        chrono.fin = maintenant + chrono.restantMs;
        sonGo();
        majBoutonDemarrer();
      }
      if (chrono.phase === "course") {
        const restant = Math.max(0, chrono.fin - maintenant);
        const i = rendre();
        if (restant === 0) {
          chrono.phase = "fini"; chrono.restantMs = 0;
          arreterBoucle(); libererEcran(); majBoutonDemarrer(); rendre();
          sonFin();
          if (vueActuelle !== "partie") statut("Temps écoulé !", "ok", 6000);
        } else if (i > chrono.mancheVue) {
          chrono.mancheVue = i; sonManche();
        }
      }
    }

    $("chronoDemarrer").addEventListener("click", () => {
      audio(); // autorise le son (obligatoire après un toucher sur mobile)
      const phase = chrono.phase;
      if (phase === "depart") { initialiserChrono(); return; }
      if (phase === "course") {
        chrono.restantMs = Math.max(0, chrono.fin - Date.now());
        chrono.phase = "pause"; arreterBoucle(); libererEcran(); majBoutonDemarrer(); rendre();
        return;
      }
      if (phase === "fini") initialiserChrono();
      if (chrono.phase === "repos") {
        const r = lireReglages();
        if (r.total <= 0) { statut("Entrez une durée supérieure à 0.", "erreur", 3000); return; }
        if (r.manches > r.total) { statut("Trop de manches pour cette durée.", "erreur", 3000); return; }
        statut("");
        for (const k in pointsPartie) delete pointsPartie[k]; // nouvelle partie : compteurs à zéro
        afficherPanneauPoints();
        chrono.mancheVue = 0; chrono.departVu = 0;
        if (r.delai > 0) { chrono.phase = "depart"; chrono.depart = Date.now() + r.delai * 1000; }
        else { chrono.phase = "course"; chrono.fin = Date.now() + chrono.restantMs; sonGo(); }
      } else { // reprise après pause
        chrono.phase = "course"; chrono.fin = Date.now() + chrono.restantMs;
      }
      majBoutonDemarrer();
      garderEcran();
      arreterBoucle();
      chrono.minuteur = setInterval(tic, 100);
      tic();
    });
    $("chronoReset").addEventListener("click", initialiserChrono);
    ["chronoMin", "chronoSec", "chronoManches", "chronoDelai", "sousOn"].forEach(id => $(id).addEventListener("change", initialiserChrono));
    document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
      const s = Number(b.dataset.preset);
      $("chronoMin").value = Math.floor(s / 60); $("chronoSec").value = s % 60;
      initialiserChrono();
    }));

    // ---------- Démarrage ----------
    (function restaurerReglages() {
      try {
        const r = JSON.parse(lireLocal("chronoReglages", "null"));
        if (r) {
          $("chronoMin").value = Math.floor(r.total / 60); $("chronoSec").value = r.total % 60;
          $("sousOn").checked = !!r.sous; $("chronoManches").value = r.manches > 1 ? r.manches : 2;
          $("chronoDelai").value = r.delai;
        }
      } catch (e) {}
    })();
    try { if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js"); } catch (e) {}
    majThemeInterface();
    initialiserChrono();
    route();
    charger(false);
    // Mise à jour automatique douce : seulement si la page est visible et sur les écrans de points
    setInterval(() => { if (document.visibilityState === "visible" && vueActuelle !== "accueil") charger(true); }, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if ((chrono.phase === "course" || chrono.phase === "depart") && vueActuelle === "partie") garderEcran();
        if (vueActuelle !== "accueil") charger(true);
      }
    });
  </script>
</body>
</html>
